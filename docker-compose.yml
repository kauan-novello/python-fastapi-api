services:
  api:
    build: .
    container_name: fastapi-boilerplate-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://api_user:api_password@db:5432/api_db
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@api.example.com}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_USE_TLS=true
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-text}
      - RATE_LIMIT_BACKEND=${RATE_LIMIT_BACKEND:-redis}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fastapi-network
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: fastapi-boilerplate-db
    environment:
      - POSTGRES_USER=api_user
      - POSTGRES_PASSWORD=api_password
      - POSTGRES_DB=api_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api_user -d api_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fastapi-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: fastapi-boilerplate-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fastapi-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  fastapi-network:
    driver: bridge
