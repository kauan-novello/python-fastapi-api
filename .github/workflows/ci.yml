name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Use defaults for CI - tests will use in-memory SQLite
      DATABASE_URL: sqlite+aiosqlite:///:memory:
      SECRET_KEY: test-secret-key-for-ci-only-change-in-prod
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      FRONTEND_URL: http://localhost:3000
      EMAIL_FROM: test@example.com
      SMTP_HOST: localhost
      SMTP_PORT: 587
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry
          poetry config virtualenvs.create false

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Run format check
        run: poetry run ruff format --check backend/

      - name: Run lint
        run: poetry run ruff check backend/

      - name: Run type check
        run: poetry run task type_check

      - name: Run tests
        run: poetry run task test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

